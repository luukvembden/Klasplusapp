<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: [true, true, false], thema: 'Systeem' }; }
  renderVals() {
    var self = this;
    var teksten = ['Nieuw cijfer', 'Roosterwijziging', 'Huiswerk-herinnering'];
    var meldingen = teksten.map(function (t, i) {
      return { tekst: t, aan: self.state.m[i], toggle: function () { var m = self.state.m.slice(); m[i] = !m[i]; self.setState({ m: m }); } };
    });
    var themas = ['Licht', 'Donker', 'Systeem'].map(function (n) {
      var actief = self.state.thema === n;
      return { naam: n, actief: actief, bg: actief ? '#2E6B5A' : '#F1F3EF', kleur: actief ? '#FFFFFF' : '#1B2420', kies: function () { self.setState({ thema: n }); } };
    });
    return { meldingen: meldingen, themas: themas };
  }
}
</script>
