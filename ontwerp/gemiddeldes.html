<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null }; }
  renderVals() {
    var self = this;
    var fmt = function (n) { return n.toFixed(1).replace('.', ','); };
    var onv = function (n) { return n < 5.5; };
    var data = [
      { vak: 'Nederlands', t: [['Spelling', 1, 6.8], ['Betoog', 2, 7.2]] },
      { vak: 'Engels', t: [['Woordjes unit 1', 1, 6.1], ['Leesvaardigheid', 1, 5.2], ['Grammatica', 1, 4.9]] },
      { vak: 'Wiskunde B', t: [['Hoofdstuk 2', 2, 6.3], ['Hoofdstuk 3', 2, 7.4]] },
      { vak: 'Biologie', t: [['Hoofdstuk 3', 2, 7.0], ['Practicum cellen', 1, 8.1]] },
      { vak: 'Geschiedenis', t: [['Middeleeuwen', 2, 6.6], ['Bronnenopdracht', 1, 7.5]] },
      { vak: 'Scheikunde', t: [['Hoofdstuk 1', 2, 5.8]] },
      { vak: 'Frans', t: [['Woordjes', 1, 7.9], ['Luistertoets', 1, 6.4]] }
    ];
    var vakken = data.map(function (d) {
      var som = 0, w = 0;
      d.t.forEach(function (x) { som += x[1] * x[2]; w += x[1]; });
      var gem = som / w;
      var open = self.state.open === d.vak;
      return {
        vak: d.vak,
        gem: fmt(gem),
        kleur: onv(gem) ? '#A3401A' : '#1B2420',
        open: open,
        toggle: function () { self.setState({ open: open ? null : d.vak }); },
        chips: d.t.map(function (x) { return { cijfer: fmt(x[2]), bg: onv(x[2]) ? '#FBE9E0' : '#EEF1EC', kleur: onv(x[2]) ? '#A3401A' : '#1B2420' }; }),
        toetsen: d.t.map(function (x) { return { naam: x[0], weging: x[1], cijfer: fmt(x[2]), kleur: onv(x[2]) ? '#A3401A' : '#1B2420' }; })
      };
    });
    return { vakken: vakken };
  }
}
