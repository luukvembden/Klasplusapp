    <div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">

    <button aria-label="Volgende week" style="width: 32px; height: 44px; border: none; background: transparent; color: #1B2420; display: flex; align-items: center; justify-content: center; cursor: pointer">

    var les = function (u, titel, labels) { return { uur: u, titel: titel, tijd: T[u - 1], labels: labels.map(function (k) { return L[k]; }) }; };
    var week = [

    for (var i = gekozen.lessen.length; i < 10; i++) opvul.push({ i: i });
    return {
